name: iOS build

# This dev environment has no Mac/Xcode at all — this workflow is the
# ONLY place the iOS side of AdGag (Flutter's own iOS embedding, and the
# native Swift editor under ios/Runner/Editor/) is ever actually
# compiled. A macOS GitHub-hosted runner stands in for a local Mac.
#
# Simulator build: this workflow only confirms the Swift/Flutter code
# COMPILES on every push. Signed builds for TestFlight are made by
# ios-testflight.yml (manual run or a v* tag).
on:
  push:
    branches: [master, main]
    paths:
      - "ios/**"
      - "lib/**"
      - "third_party/**"
      - ".gitignore"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "lib/**"
      - "third_party/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # cache: reuse the Flutter SDK between runs — a run once failed
      # downloading it (curl exit 56) before any code was compiled.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # --simulator, not a device build: a device build still demands a
      # Development Team even with --no-codesign (every run failed on
      # "Building a deployable iOS app requires a selected Development
      # Team" BEFORE compiling any Swift). A simulator build needs no
      # signing at all and compiles exactly the same Dart/Swift code.
      - name: Build iOS (simulator, compile check)
        run: flutter build ios --simulator --debug

      - name: Run RunnerTests (XCTest)
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
        continue-on-error: true
