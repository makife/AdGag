name: adgag
description: >
  AdGag — the social network where everything is an ad.
  "See it. Ad it. Go." Internal codename: everything_is_an_ad.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

# ---------------------------------------------------------------------------
# Dependency notes (see README.md "Technology Choices" for full reasoning):
#
# - State management: flutter_riverpod WITHOUT the riverpod_generator/
#   riverpod_annotation codegen path. Providers are hand-written
#   (NotifierProvider / AsyncNotifierProvider). This avoids a build_runner
#   dependency for the MVP and keeps `flutter run` working with zero
#   code-generation step. Codegen can be introduced later without a rewrite.
# - Models: hand-written immutable classes (manual fromJson/toJson/copyWith)
#   instead of freezed/json_serializable, for the same build_runner-free
#   reason. Revisit once the model count grows past what's comfortable by
#   hand.
# - Routing: go_router — Flutter-team maintained, supports deep links,
#   ShellRoute for the bottom-nav shell, and typed path/query params.
# - Backend: supabase_flutter — official Supabase Flutter SDK.
# - Video capture/playback: camera + video_player (both Flutter-team
#   maintained, first-party-adjacent). Trimming: easy_video_editor (native
#   trim/merge without an FFmpeg dependency, actively maintained).
# - Video delivery: NOT a Flutter dependency at all — see
#   lib/core/video/video_service.dart abstraction. The chosen MVP provider
#   (Mux) is only ever called from Supabase Edge Functions, never from the
#   client, per CLAUDE.md #18/#42.
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing / deep links
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.1

  # Localization (version pinned by what flutter_localizations from the
  # installed Flutter SDK requires — let `flutter pub get` dictate this).
  intl: ^0.20.3

  # Media: capture, playback, gallery import. Editing/trimming/export
  # itself is entirely native (Kotlin/Media3 CompositionPlayer on
  # Android, Swift/AVFoundation on iOS — see
  # lib/core/media/native_editor_bridge.dart) — no Flutter-side video-
  # editing package is needed anymore. easy_video_editor,
  # ffmpeg_kit_flutter_new_video, and file_picker (background-music
  # selection) were removed along with the Flutter editor they backed;
  # see git history for that whole prior architecture if ever needed
  # again.
  camera: ^0.11.0+2
  video_player: ^2.9.5
  image_picker: ^1.1.2

  # Media delivery / rendering
  cached_network_image: ^3.4.1

  # Permissions (camera, microphone, photo library)
  permission_handler: ^11.3.1

  # Native share sheet (section 33 — external viral loop). ^13.3.0, not
  # ^12.0.2 — required to resolve alongside file_picker (which needs
  # win32 ^6.3.0 via its Windows sub-package; share_plus 12.x pinned
  # win32 ^5.5.3). Verified via pub.dev before bumping: still
  # is:built-in-kotlin, 150/160 points, no API change needed (this app
  # already uses the modern SharePlus.instance/ShareParams API, not the
  # older static Share.share it also long ago deprecated).
  share_plus: ^13.3.0

  # Filesystem paths for local drafts/cache (section 39/40)
  path_provider: ^2.1.5

  # IDs for idempotency keys (uploads, client-generated draft ids)
  uuid: ^4.5.1

  # Structured logging (section 55) — thin wrapper, no vendor lock-in
  logging: ^1.3.0

  # Direct-to-provider video upload with progress/cancellation (section 39).
  # Used only inside lib/core/video/ — never leaks past that boundary.
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generates native launcher icons (Android mipmaps, iOS AppIcon.appiconset,
  # web/windows/macos) from assets/branding/AdGagIkon.png — run via
  # `dart run flutter_launcher_icons`. Dev-only: never a runtime dependency.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true # drives flutter gen-l10n from l10n.yaml

  assets:
    - assets/branding/

# flutter_launcher_icons config (CLAUDE.md section 65: brand assets stay
# swappable — this is the one place the launcher icon source is named).
# AdGagIkon.png is the icon-only mark (no wordmark/tagline baked in),
# distinct from AdGag.png (full lockup with wordmark + tagline, used as an
# in-app image, not an icon source — see splash_screen.dart/
# onboarding_screen.dart).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/AdGagIkon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/AdGagIkon.png"
  windows:
    generate: true
    image_path: "assets/branding/AdGagIkon.png"
  macos:
    generate: true
    image_path: "assets/branding/AdGagIkon.png"
